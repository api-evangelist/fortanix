apis:
- aid: fortanix:dsm
  name: Fortanix Data Security Manager REST API
  description: 'REST API for the Fortanix Data Security Manager (DSM): account, group,
    app, user and role administration plus key lifecycle (generate, import, rotate,
    export, destroy) and cryptographic operations (encrypt, decrypt, sign, verify,
    digest, HMAC, key agreement, key wrapping, multi-part and batch crypto), approval
    requests, Lua plugins, audit logs and account statistics.'
