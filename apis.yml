aid: fortanix
name: Fortanix
description: 'Fortanix is a data-security company building the Fortanix Data & AI Security
  Platform, a unified control plane for enterprise cryptography. Its products include
  Data Security Manager (DSM) — a FIPS 140-2 Level 3 validated key-management, HSM,
  tokenization and secrets service delivered as SaaS or as on-premises appliances;
  Confidential Computing Manager (CCM) for enclave conversion, attestation and workload
  signing on Intel SGX and AWS Nitro; Key Insight for cryptographic discovery, posture
  and post-quantum readiness across cloud and on-premises estates; and Fortanix Armor.
  All three products publish public REST APIs with machine-readable OpenAPI/Swagger
  contracts, and Fortanix ships first-party client SDKs (Java, Python, Go, Rust, C#,
  PHP, JavaScript), a Python CLI (sdkms-cli), Terraform providers, and legacy cryptographic
  interfaces (PKCS#11, Microsoft CNG, Java JCE).'
