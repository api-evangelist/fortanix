            $ref: '#/components/schemas/MetadataStringConstraint'
          deactivation_date:
            $ref: '#/components/schemas/MetadataDurationConstraint'
          activation_date:
            $ref: '#/components/schemas/MetadataDurationConstraint'
        required:
        - custom_metadata
    LmsOptionsPolicy:
      allOf:
      - type: object
        properties: {}
    GetGroupsParams:
      allOf:
      - type: object
        properties:
          limit:
            type: integer
          filter:
            type: string
            description: 'If specified, only groups matching this `filter` are returned.


              The following fields can be referenced in the filter:

              - `name`

              - `created_at`

              - `description`

              - `wrapping_key_name`'
          offset:
            type: integer
            description: Number of groups to skip
          continuation_token:
            type: string
            description: 'Continuation token to continue getting results. It must be the same

              token returned from the backend from a previous call, or empty.


              Existence of this query parameter controls the response (and the backend behavior):

              - If specified (including an empty value), the backend returns metadata alongside

              the collection of groups. The metadata will potentially contain a fresh `continuation_token`.


              Note: If there is a `limit` specified in the request and DSM returns `limit`-many items in the

              response, it will still include a fresh continuation token if there are more items in the collection.

              Additionally, unlike other query parameters, `limit` is not required to remain unchanged in a chain of

              requests with `continuation_token`s.

              - If omitted, the backend returns just a collection of groups with no metadata.'
      - $ref: '#/components/schemas/GroupSort'
    PrincipalUserViaApp:
      allOf:
      - type: object
        description: UserViaApp signifies a user authorizing some app to act on its behalf through OAuth.
        properties:
          user_id:
            type: string
            format: uuid
          scopes:
            type: array
            uniqueItems: true
            items:
              $ref: '#/components/schemas/OauthScope'
        required:
        - user_id
        - scopes
    FpeDate:
      description: 'A structure for specifying a token part representing a date that occurs after a specified date

        and/or occurs before a specified date. Depending on the subparts that make up the date, one of

        the three options is used.'
      oneOf:
      - title: FpeDateVariantDayMonthYear
        type: object
        properties:
          dmy_date:
            $ref: '#/components/schemas/FpeDateDayMonthYear'
        required:
        - dmy_date
      - title: FpeDateVariantMonthDay
        type: object
        properties:
          month_day_date:
            $ref: '#/components/schemas/FpeDateMonthDay'
        required:
        - month_day_date
      - title: FpeDateVariantMonthYear
        type: object
        properties:
          month_year_date:
            $ref: '#/components/schemas/FpeDateMonthYear'
        required:
        - month_year_date
    FpeDayMonthYearDate:
      allOf:
      - type: object
        description: 'A structure for specifying a particular date consisting of a day, month, and year, for use in

          an FpeDate structure.'
        properties:
          year:
            type: integer
            minimum: 0
            maximum: 4294967295
            description: The year, which should be an integer less than 100000. Zero is treated as a leap year.
          month:
            type: integer
            minimum: 0
            maximum: 255
            description: The month, which should be an integer from 1 to 12.
          day:
            type: integer
            minimum: 0
            maximum: 255
            description: 'The day, which should be an integer from 1 to either 28, 29, 30, or 31, depending on the

              month and year.'
        required:
        - year
        - month
        - day
    KcdsaOptionsPolicy:
      allOf:
      - type: object
        properties: {}
    TepKeyMap:
      allOf:
      - type: object
        properties:
          path:
            $ref: '#/components/schemas/ApiPath'
          kid:
            type: string
            format: uuid
          mode:
            $ref: '#/components/schemas/CipherMode'
        required:
        - path
        - kid
        - mode
    AwsKmsInfo:
      allOf:
      - type: object
        description: Information and properties of an AWS KMS key.
        properties:
          multi_region:
            $ref: '#/components/schemas/AwsMultiRegionInfo'
          aws_key_rotation_status:
            $ref: '#/components/schemas/AwsKeyRotationStatus'
          origin:
            $ref: '#/components/schemas/AwsKeyOrigin'
    Pkcs11ClientConfig:
      allOf:
      - type: object
        properties:
          fake_rsa_x9_31_keygen_support:
            type:
            - boolean
            - 'null'
          signing_aes_key_as_hmac:
            type:
            - boolean
            - 'null'
          exact_key_ops:
            type:
            - boolean
            - 'null'
          prevent_duplicate_opaque_objects:
            type:
            - boolean
            - 'null'
          opaque_objects_are_not_certificates:
            type:
            - boolean
            - 'null'
          max_concurrent_requests_per_slot:
            type:
            - integer
            - 'null'
    GroupRequest:
      allOf:
      - type: object
        properties:
          add_hmg:
            type:
            - array
            - 'null'
            items:
              $ref: '#/components/schemas/HmgConfig'
          approval_policy:
            $ref: '#/components/schemas/GroupApprovalPolicy'
          auto_scan:
            $ref: '#/components/schemas/RemovableAutoScanSettings'
          client_configurations:
            $ref: '#/components/schemas/ClientConfigurationsRequest'
          cryptographic_policy:
            $ref: '#/components/schemas/RemovableCryptographicPolicy'
          custodian_policy:
            $ref: '#/components/schemas/QuorumPolicy'
          custom_metadata:
            type:
            - object
            - 'null'
            additionalProperties:
              type: string
          del_hmg:
            type:
            - array
            - 'null'
            uniqueItems: true
            items:
              type: string
              format: uuid
          description:
            type:
            - string
            - 'null'
          export_policy:
            $ref: '#/components/schemas/ExportPolicy'
          google_access_reason_policy:
            $ref: '#/components/schemas/RemovableGoogleAccessReasonPolicy'
          hmg_redundancy:
            $ref: '#/components/schemas/RemovableHmgRedundancyScheme'
          hmg_segregation:
            type:
            - boolean
            - 'null'
          hmg_sync:
            type:
            - boolean
            - 'null'
          key_history_policy:
            $ref: '#/components/schemas/RemovableKeyHistoryPolicy'
          key_metadata_policy:
            $ref: '#/components/schemas/RemovableKeyMetadataPolicy'
          mod_hmg:
            type:
            - object
            - 'null'
            additionalProperties:
              $ref: '#/components/schemas/HmgConfig'
          name:
            type:
            - string
            - 'null'
            maxLength: 4096
            pattern: ^[^\n]*[^\s\n][^\n]*$
          wrapping_key_name:
            $ref: '#/components/schemas/WrappingKeyName'
    KeyCreationMethod:
      description: Information about the method by which a key was created
      oneOf:
      - $ref: '#/components/schemas/KeyCreationMethodVariantGenerate'
      - $ref: '#/components/schemas/KeyCreationMethodVariantAgree'
      - $ref: '#/components/schemas/KeyCreationMethodVariantTransform'
      - $ref: '#/components/schemas/KeyCreationMethodVariantDerive'
      - $ref: '#/components/schemas/KeyCreationMethodVariantUnwrap'
      - $ref: '#/components/schemas/KeyCreationMethodVariantImport'
      - $ref: '#/components/schemas/KeyCreationMethodVariantEncapsulate'
      - $ref: '#/components/schemas/KeyCreationMethodVariantDecapsulate'
      discriminator:
        propertyName: method
        mapping:
          Generate: KeyCreationMethodVariantGenerate
          Agree: KeyCreationMethodVariantAgree
          Transform: KeyCreationMethodVariantTransform
          Derive: KeyCreationMethodVariantDerive
          Unwrap: KeyCreationMethodVariantUnwrap
          Import: KeyCreationMethodVariantImport
          Encapsulate: KeyCreationMethodVariantEncapsulate
          Decapsulate: KeyCreationMethodVariantDecapsulate
    ExternalKeyId:
      description: 'Identification information for an external key. There are multiple

        variants of this type to represent the different kinds of keys DSM

        supports (e.g., AWS, Azure, etc.).


        This is not to be confused with the UUID assigned to a virtual key

        in DSM, which is most likely different from the ID that the source

        key (outside of DSM) has.'
      oneOf:
      - $ref: '#/components/schemas/ExternalKeyIdPkcs11'
      - $ref: '#/components/schemas/ExternalKeyIdFortanix'
      - $ref: '#/components/schemas/ExternalKeyIdAwsKms'
      - $ref: '#/components/schemas/ExternalKeyIdAzureKeyVault'
      - $ref: '#/components/schemas/ExternalKeyIdGcpKeyRing'
      - $ref: '#/components/schemas/ExternalKeyIdOciVault'
      - type: object
        properties: {}
    ScanHmgRequest:
      allOf:
      - type: object
        properties: {}
    TlsConfigVariantOpportunistic:
      allOf:
      - type: object
        properties:
          mode:
            type: string
            enum:
            - opportunistic
        required:
        - mode
      - type: object
        properties: {}
    KeyCreationMethodVariantImport:
      allOf:
      - type: object
        properties:
          method:
            type: string
            enum:
            - Import
        required:
        - method
      - type: object
        properties: {}
    AesOptionsPolicy:
      allOf:
      - type: object
        properties:
          key_sizes:
            type:
            - array
            - 'null'
            items:
              type: integer
              minimum: 0
              maximum: 4294967295
          random_iv:
            type:
            - boolean
            - 'null'
          fpe:
            $ref: '#/components/schemas/FpeOptions'
    TepClientConfig:
      allOf:
      - type: object
        properties:
          schema:
            $ref: '#/components/schemas/TepSchema'
          key_map:
            $ref: '#/components/schemas/TepKeyMapList'
        required:
        - schema
        - key_map
  parameters:
    GetGroupsParams:
      in: query
      name: GetGroupsParams
      schema:
        $ref: '#/components/schemas/GetGroupsParams'
      explode: true
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    apiKeyAuth:
      type: apiKey
      name: Authorization
      in: header
      description: Please enter your token prefixed with 'Basic ' (e.g., 'Basic your_token_here')
    bearerToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
