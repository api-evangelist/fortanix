        properties:
          min_length:
            type: integer
            minimum: 0
            maximum: 4294967295
            description: The minimum allowed length for this part (in chars).
          max_length:
            type: integer
            minimum: 0
            maximum: 4294967295
            description: The maximum allowed length for this part (in chars).
          char_set:
            $ref: '#/components/schemas/FpeCharSet'
          cipher_char_set:
            $ref: '#/components/schemas/FpeCharSet'
