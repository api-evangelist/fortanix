openapi: 3.2.0
info:
  title: Fortanix DSM REST Groups API
  description: This is a set of REST APIs for accessing the Fortanix Data Security Manager.
  termsOfService: https://fortanix.com/legal/agreements-and-standard-terms
  contact:
    name: Fortanix Support
    url: https://support.fortanix.com/
    email: support@fortanix.com
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  version: 0.1.0-20260710
servers:
- url: '{dsmEndpoint}'
  description: DSM Endpoint
  variables:
    dsmEndpoint:
      default: https://amer.smartkey.io
      description: Type your DSM server URL here (include https://)
tags:
- name: Groups
paths:
  /sys/v1/groups/{group_id}/hmg/scans:
    post:
      operationId: AsyncScanHmg
      tags:
      - Groups
      security:
      - bearerToken: []
      - apiKeyAuth: []
      summary: Scan external objects asynchronously
      description: 'Scan external objects asynchronously and create corresponding

        virtual sobjects in the group as needed. If there is already a virtual

        sobject corresponding to a scanned object, no sobject is created.

        This is only supported for DSM-backed groups currently.'
      parameters:
      - name: group_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        2XX:
          description: Success result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scan'
    get:
      operationId: GetAllHmgScans
      tags:
      - Groups
      security:
      - bearerToken: []
      - apiKeyAuth: []
      summary: Retrieve the scan status of an external group
      description: Retrieve the scan status of an external group.
      parameters:
      - name: group_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        2XX:
          description: Success result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAllHmgScansResponse'
  /sys/v1/groups/{group_id}/hmg/check:
    post:
      operationId: CheckHmg
      tags:
      - Groups
      security:
      - bearerToken: []
      - apiKeyAuth: []
      summary: Check that the HMG configuration for a particular group is valid and reachable
      description: 'Check that the HMG configuration for a particular group is

        valid and reachable.'
      parameters:
      - name: group_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckHmgRequest'
      responses:
        '204':
          description: Nothing is returned on success
  /sys/v1/groups/hmg/check:
    post:
      operationId: CheckHmgConfig
      tags:
      - Groups
      security:
      - bearerToken: []
      - apiKeyAuth: []
      summary: Check that the HMG configuration provided is valid and reachable
      description: Check that the HMG configuration provided is valid and reachable.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HmgConfig'
      responses:
        '204':
          description: Nothing is returned on success
  /sys/v1/groups:
    post:
      operationId: CreateGroup
      tags:
      - Groups
      security:
      - bearerToken: []
      - apiKeyAuth: []
      summary: Create a new group with the specified properties
      description: Create a new group with the specified properties.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupRequest'
      responses:
        2XX:
          description: Success result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
    get:
      operationId: ListGroups
      tags:
      - Groups
      security:
      - bearerToken: []
      - apiKeyAuth: []
      summary: Get all groups accessible to the requester
      description: Get all groups accessible to the requester.
      parameters:
      - $ref: '#/components/parameters/GetGroupsParams'
      responses:
        2XX:
          description: Success result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListGroupsResponse'
  /sys/v1/groups/{group_id}:
    delete:
      operationId: DeleteGroup
      tags:
      - Groups
      security:
      - bearerToken: []
      - apiKeyAuth: []
      summary: Delete the group
      description: Delete the group.
      parameters:
      - name: group_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Nothing is returned on success
    get:
      operationId: GetGroup
      tags:
      - Groups
      security:
      - bearerToken: []
      - apiKeyAuth: []
      summary: Lookup a specific group
      description: Lookup a specific group.
      parameters:
      - name: group_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        2XX:
          description: Success result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
    patch:
      operationId: UpdateGroup
      tags:
      - Groups
      security:
      - bearerToken: []
      - apiKeyAuth: []
      summary: Change a group's properties
      description: Change a group's properties.
      parameters:
      - name: group_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupRequest'
      responses:
        2XX:
          description: Success result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
  /sys/v1/groups/hmg/gcp_key_rings:
    post:
      operationId: GetGcpKeyRings
      tags:
      - Groups
      security:
      - bearerToken: []
      - apiKeyAuth: []
      summary: Given an GCP configuration, fetch a list of available GCP key rings which can…
      description: 'Given an GCP configuration, fetch a list of available

        GCP key rings which can be used to back a group.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GcpKeyRingConfig'
      responses:
        2XX:
          description: Success result
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
  /sys/v1/groups/{group_id}/hmg/scans/{scan_id}:
    get:
      operationId: GetScan
      tags:
      - Groups
      security:
      - bearerToken: []
      - apiKeyAuth: []
      summary: Query the status of a particular scan.
      description: 'Query the status of a particular scan. Only the last five completed

        scans,as well as any in-progress scan, is queryable.'
      parameters:
      - name: group_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: scan_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        2XX:
          description: Success result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scan'
  /sys/v1/groups/hmg/azure_vaults:
    post:
      operationId: GetVaults
      tags:
      - Groups
      security:
      - bearerToken: []
      - apiKeyAuth: []
      summary: Given an Azure configuration, fetch a list of available Azure key vaults which…
      description: 'Given an Azure configuration, fetch a list of available

        Azure key vaults which can be used to back a group.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HmgConfig'
      responses:
        2XX:
          description: Success result
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/KeyVault'
  /sys/v1/groups/hmg/scan_collections:
    post:
      operationId: ListKeyCollections
      tags:
      - Groups
      security:
      - bearerToken: []
      - apiKeyAuth: []
      summary: Using the chosen credential, list the key collections available
      description: Using the chosen credential, list the key collections available.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HmgListKeyCollectionsRequest'
      responses:
        2XX:
          description: Success result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HmgListKeyCollectionsResponse'
  /sys/v1/groups/{group_id}/hmg/scan:
    post:
      operationId: ScanHmg
      tags:
      - Groups
      security:
      - bearerToken: []
      - apiKeyAuth: []
      summary: Scan external objects
      description: 'Scan external objects synchronously and create corresponding

        virtual sobjects in the group as needed. If there is already a

        virtual sobject corresponding to a scanned object, no sobject

        is created (but the existing virtual sobject may be updated).


        Returns a list of all the newly-created sobjects.'
      parameters:
      - name: group_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScanHmgRequest'
      responses:
        2XX:
          description: Success result
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Sobject'
components:
  schemas:
    FpeInputProcessingPassthroughSpecific:
      allOf:
      - type: object
        properties:
          passthrough:
            type: array
            uniqueItems: true
            items:
              type: string
              minLength: 1
              maxLength: 1
          other:
            $ref: '#/components/schemas/FpeInputDefaultProcessing'
        required:
        - passthrough
        - other
    RsaEncryptionPaddingPolicy:
      description: RSA encryption padding policy.
      oneOf:
      - title: RsaEncryptionPaddingPolicyVariantOaep
        type: object
        properties:
          OAEP:
            $ref: '#/components/schemas/RsaEncryptionPaddingPolicyOaep'
        required:
        - OAEP
      - title: RsaEncryptionPaddingPolicyVariantPkcs1V15
        type: object
        properties:
          PKCS1_V15:
            type: object
            properties: {}
        required:
        - PKCS1_V15
      - title: RsaEncryptionPaddingPolicyVariantRawDecrypt
        type: object
        properties:
          RAW_DECRYPT:
            type: object
            properties: {}
        required:
        - RAW_DECRYPT
    AwsKeyRotationStatusKeyRotationEnabled:
      allOf:
      - type: object
        properties:
          rotation_period_in_days:
            type:
            - integer
            - 'null'
            minimum: 0
            maximum: 65535
    GroupSort:
      oneOf:
      - title: GroupSortVariantByGroupId
        type: object
        properties:
          sort_by:
            type: string
            pattern: ^group_id:(?:asc|desc)$
            example: group_id:asc
          previous_id:
            type: string
            format: uuid
        required:
        - previous_id
      - title: GroupSortVariantByGroupName
        type: object
        properties:
          sort_by:
            type: string
            pattern: ^group_name:(?:asc|desc)$
            example: group_name:asc
          previous_sort_value:
            type: string
            maxLength: 4096
            pattern: ^[^\n]*[^\s\n][^\n]*$
        required:
        - previous_sort_value
    LegacyKeyPolicy:
      type: string
      enum:
      - allowed
      - prohibited
      - unprotect_only
    MetadataDurationConstraint:
      oneOf:
      - title: MetadataDurationConstraintVariantForbidden
        type: object
        properties:
          forbidden:
            type: object
            properties: {}
        required:
        - forbidden
      - title: MetadataDurationConstraintVariantRequired
        type: object
        properties:
          required:
            $ref: '#/components/schemas/MetadataDurationConstraintRequired'
        required:
        - required
    BlsVariant:
      description: Signature/public-key size trade-off for BLS.
      type: string
      enum:
      - small_signatures
      - small_public_keys
    HmgConfigVariantAwsCloudHsm:
      allOf:
      - type: object
        properties:
          kind:
            type: string
            enum:
            - AwsCloudHsm
        required:
        - kind
      - $ref: '#/components/schemas/HmgConfigAwsCloudHsm'
    KeyCreationMethodVariantEncapsulate:
      allOf:
      - type: object
        properties:
          method:
            type: string
            enum:
            - Encapsulate
        required:
        - method
      - type: object
        properties: {}
    ClientConfigurations:
      allOf:
      - type: object
        properties:
          common:
            $ref: '#/components/schemas/CommonClientConfig'
          pkcs11:
            $ref: '#/components/schemas/Pkcs11ClientConfig'
          kmip:
            $ref: '#/components/schemas/KmipClientConfig'
          tep:
            $ref: '#/components/schemas/TepClientConfig'
    HmgConfigNcipher:
      allOf:
      - type: object
        properties:
          url:
            type: string
          tls:
            $ref: '#/components/schemas/TlsConfig'
          slot:
            type: integer
          pin:
            type: string
          hsm_order:
            type:
            - integer
            - 'null'
            format: int32
            description: 'The priority of this `HmgConfig`. This is used when a group is

              configured with an `HmgRedundancyScheme`, and is otherwise

              unused. (See the docs for `HmgRedundancyScheme` for more

              information about the interpretation of this field.)'
        required:
        - url
        - tls
        - slot
    ScanResultFailed:
      allOf:
      - type: object
        description: 'Indicates that a scan has failed. The most recent error is included

          (taken from the last retry).'
        properties:
          message:
            type: string
        required:
        - message
    FpeConstraints:
      allOf:
      - type: object
        description: Constraints on a portion of a complex tokenization data type.
        properties:
          luhn_check:
            type:
            - boolean
            - 'null'
            description: 'Whether the token part contains a checksum that satisfies the Luhn formula. It is an

              error to apply this constraint to non-numeric parts, or to have an encrypted part be

              under more than one Luhn check constraint. Also, if an encrypted part has a Luhn check

              constraint applied to it and may contain at least one digit that is not preserved, it

              must not specify any other constraints.'
          num_gt:
            type:
            - integer
            - 'null'
            description: 'Number that the token part should be greater than.


              This constraint can only be specified on (non-compound) numeric encrypted parts

              guaranteed to preserve either everything or nothing at all. (For example, if an

              encrypted part consists of 5 to 10 digits, a `preserve` list that covers only the

              first five digits is not guaranteed to preserve everything, because if the input

              happens to be six or more digits long, there will be at least one digit that

              remains unpreserved.)'
          num_lt:
            type:
            - integer
            - 'null'
            description: 'Number that the token part should be smaller than.


              This constraint can only be specified on (non-compound) numeric encrypted parts

              guaranteed to preserve either everything or nothing at all. (For example, if an

              encrypted part consists of 5 to 10 digits, a `preserve` list that covers only the

              first five digits is not guaranteed to preserve everything, because if the input

              happens to be six or more digits long, there will be at least one digit that

              remains unpreserved.)'
          num_ne:
            type:
            - array
            - 'null'
            items:
              type: integer
            description: 'Numbers that the token part should not be equal to. It is an error to apply this

              constraint to non-numeric parts.'
          date:
            $ref: '#/components/schemas/FpeDateConstraint'
          applies_to:
            $ref: '#/components/schemas/FpeConstraintsApplicability'
    FpeWordsIntegerRanges:
      allOf:
      - type: object
        description: 'A union of positive integer ranges.


          ```plain

          Examples: [[0, 400], [402, 1000]]

          = {0000, 0001, ..., 0400, 0402, ..., 1000}


          [[1,3], [49, 50]] with optional padding of length 8

          = {00000001, 00000002, 00000003, 00000049, 00000050}

          (accepts 1, 01, 00002, 49, 000050, etc)

          ```'
        properties:
          ranges:
            type: array
            items:
              type: array
              items:
                type: integer
              minItems: 2
              maxItems: 2
          padding_required:
            type: boolean
            description: 'If this field is true, this set accepts only numeric strings

              padded to the length given by the maximum integer in the range

              set.'
        required:
        - ranges
        - padding_required
    TlsConfig:
      description: TLS client settings.
      oneOf:
      - $ref: '#/components/schemas/TlsConfigVariantDisabled'
      - $ref: '#/components/schemas/TlsConfigVariantOpportunistic'
      - $ref: '#/components/schemas/TlsConfigVariantRequired'
      discriminator:
        propertyName: mode
        mapping:
          disabled: TlsConfigVariantDisabled
          opportunistic: TlsConfigVariantOpportunistic
          required: TlsConfigVariantRequired
    ClientFileLoggingVariantEnabled:
      allOf:
      - type: object
        properties:
          mode:
            type: string
            enum:
            - enabled
        required:
        - mode
      - $ref: '#/components/schemas/ClientFileLoggingConfig'
    CipherMode:
      description: Cipher mode used for symmetric key algorithms.
      type: string
      enum:
      - ECB
      - CBC
      - CBCNOPAD
      - CFB
      - OFB
      - CTR
      - GCM
      - CCM
      - KW
      - KWP
      - FF1
    CaConfig:
      description: CA settings.
      oneOf:
      - title: CaConfigVariantCaSet
        type: object
        properties:
          ca_set:
            $ref: '#/components/schemas/CaSet'
        required:
        - ca_set
      - title: CaConfigVariantPinned
        type: object
        properties:
          pinned:
            type: array
            items:
              type: string
              format: byte
        required:
        - pinned
    CountAccuracy:
      description: An indicator of how accurate a count of objects is.
      oneOf:
      - $ref: '#/components/schemas/CountAccuracyVariantExact'
      - $ref: '#/components/schemas/CountAccuracyVariantApproximate'
      discriminator:
        propertyName: $type
        mapping:
          Exact: CountAccuracyVariantExact
          Approximate: CountAccuracyVariantApproximate
    Slip10Options:
      allOf:
      - type: object
        properties:
          derivation_path:
            type: array
            items:
              type: integer
              minimum: 0
              maximum: 4294967295
            description: 'The Slip10 path, starting from master. Master key is [].


              Ex: m/42/42''/0 -> [42, 2**31 + 42, 0]'
        required:
        - derivation_path
    KcdsaOptions:
      allOf:
      - type: object
        properties:
          subgroup_size:
            type:
            - integer
            - 'null'
            minimum: 0
            maximum: 4294967295
          hash_alg:
            $ref: '#/components/schemas/DigestAlgorithm'
    AzureAuthConfigVariantClientSecret:
      allOf:
      - type: object
        properties:
          mode:
            type: string
            enum:
            - client_secret
        required:
        - mode
      - $ref: '#/components/schemas/AzureAuthConfigClientSecret'
    RemovablePkcs11ClientConfig:
      oneOf:
      - type: string
        enum:
        - remove
      - $ref: '#/components/schemas/Pkcs11ClientConfig'
    ObjectTypeFilter:
      oneOf:
      - $ref: '#/components/schemas/ObjectTypeFilterVariantAll'
      - $ref: '#/components/schemas/ObjectTypeFilterVariantSelection'
      discriminator:
        propertyName: $type
        mapping:
          All: ObjectTypeFilterVariantAll
          Selection: ObjectTypeFilterVariantSelection
    ExportPolicy:
      oneOf:
      - $ref: '#/components/schemas/ExportPolicyVariantWrapped'
      - $ref: '#/components/schemas/ExportPolicyVariantUnrestricted'
      discriminator:
        propertyName: $type
        mapping:
          Wrapped: ExportPolicyVariantWrapped
          Unrestricted: ExportPolicyVariantUnrestricted
    KmipClientConfig:
      allOf:
      - type: object
        properties:
          ignore_unknown_key_ops_for_secrets:
            type:
            - boolean
            - 'null'
            description: Use `ignore_unknown_key_ops_for` with [SECRET] instead of `ignore_unknown_key_ops_for_secrets``
          ignore_unknown_key_ops_for:
            $ref: '#/components/schemas/ObjectTypeFilter'
          key_ops_override:
            $ref: '#/components/schemas/KeyOpsOverride'
    MetadataDurationConstraintRequired:
      allOf:
      - type: object
        properties:
          allowed_values:
            $ref: '#/components/schemas/RestrictedDuration'
    EffectiveKeyOperations:
      description: "Operations allowed to be performed on a given key by a given User or an app\n\n\n\n          SIGN:\n            If this is set, the key can be used for signing.\n\n\n          VERIFY:\n            If this is set, the key can used for verifying a signature.\n\n\n          ENCRYPT:\n            If this is set, the key can be used for encryption.\n\n\n          DECRYPT:\n            If this is set, the key can be used for decryption.\n\n\n          WRAPKEY:\n            If this is set, the key can be used wrapping other keys.\n            The key being wrapped must have the EXPORT operation enabled.\n\n\n          UNWRAPKEY:\n            If this is set, the key can be used to unwrap a wrapped key.\n\n\n          DERIVEKEY:\n            If this is set, the key can be used to derive another key.\n\n\n          TRANSFORM:\n            If this is set, the key can be transformed.\n\n\n          MACGENERATE:\n            If this is set, the key can be used to compute a cryptographic\n            Message Authentication Code (MAC) on a message.\n\n\n          MACVERIFY:\n            If they is set, the key can be used to verify a MAC.\n\n\n          EXPORT:\n            If this is set, the value of the key can be retrieved\n            with an authenticated request. This shouldn't be set unless\n            required. It is more secure to keep the key's value inside DSM only.\n\n\n          APPMANAGEABLE:\n            Without this operation, management operations like delete, destroy,\n            rotate, activate, restore, revoke, revert, update, remove_private, etc.\n            cannot be performed by a crypto App.\n            A user with access or admin app can still perform these operations.\n            This option is only relevant for crypto apps.\n\n\n          HIGHVOLUME:\n            If this is set, audit logs will not be recorded for the key.\n            High volume here tries to signify a key that is being used a lot\n            and will produce lots of logs. Setting this operation disables\n            audit logs for the key.\n\n\n          AGREEKEY:\n            If this is set, the key can be used for key agreement.\n            Both the private and public key should have this option enabled\n            to perform an agree operation.\n\n\n          ENCAPSULATE:\n            If this is set, the key can be used for key encapsulation. The\n            result is a new symmetric key and a ciphertext.\n\n\n          DECAPSULATE:\n            If this is set, the key can be used for key decapsulation. If\n            decapsulation succeeds, the result is a new symmetric key.\n\n\n          MASKDECRYPT:\n            If this is set, the key can be used for masked decryption only.\n\n"
      type: string
      enum:
      - SIGN
      - VERIFY
      - ENCRYPT
      - DECRYPT
      - WRAPKEY
      - UNWRAPKEY
      - DERIVEKEY
      - TRANSFORM
      - MACGENERATE
      - MACVERIFY
      - EXPORT
      - APPMANAGEABLE
      - HIGHVOLUME
      - AGREEKEY
      - ENCAPSULATE
      - DECAPSULATE
      - MASKDECRYPT
    FpeCharSet:
      description: 'The alphabet to use for an encrypted portion of a complex tokenization data type.

        Characters should be specified as a list of pairs, where each pair [a, b] represents the

        range of Unicode code points from a to b, with both bounds being inclusive. A single

        code point can be specified as [c, c].


        Normally, each character is assigned a numeric value for FF1. The first character is

        assigned a value of 0, and subsequent characters are assigned values of 1, 2, and so on,

        up to the size of the alphabet. Note that the order of the ranges matters; characters

        appearing in later ranges are assigned higher numerical values compared to earlier

        characters. For instance, in the FpeCharSet [[''a'', ''z''], [''0'', ''9'']], the digits ''0'' to

        ''9'' are assigned values from 26 to 35, since they are listed after the ''a'' to ''z'' range.


        In any case, ranges should not overlap with each other, and should not contain surrogate

        code points.'
      allOf:
      - type: array
        items:
          type: array
          minItems: 2
          maxItems: 2
          items:
            type: string
            minLength: 1
            maxLength: 1
    ObjectTypeFilterVariantSelection:
      allOf:
      - type: object
        properties:
          $type:
            type: string
            enum:
            - Selection
        required:
        - $type
      - $ref: '#/components/schemas/ObjectTypeFilterSelection'
    RsaOptions:
      allOf:
      - type: object
        description: RSA-specific options.
        properties:
          key_size:
            type:
            - integer
            - 'null'
            minimum: 0
            maximum: 4294967295
            description: Size in bits (not bytes) of the RSA key. Specify on Create only. Returned on Get.
          public_exponent:
            type:
            - integer
            - 'null'
            minimum: 0
            maximum: 4294967295
            description: Public exponent to use for generating the RSA key. Specify on Create only.
          encryption_policy:
            type:
            - array
            - 'null'
            items:
              $ref: '#/components/schemas/RsaEncryptionPolicy'
            description: 'Encryption policy for an RSA key. When doing an encryption or key wrapping operation, the

              policies are evaluated against the specified parameters one by one. If one matches, the

              operation is allowed. If none match, including if the policy list is empty, the operation

              is disallowed. Missing optional parameters will have their defaults specified according to

              the matched policy. The default for new keys is `[{"padding":{"OAEP":{}}]`.

              If (part of) a constraint is not specified, anything is allowed for that constraint.

              To impose no constraints, specify `[{}]`.'
          signature_policy:
            type:
            - array
            - 'null'
            items:
              $ref: '#/components/schemas/RsaSignaturePolicy'
            description: 'Signature policy for an RSA key. When doing a signature operation, the policies are

              evaluated against the specified parameters one by one. If one matches, the operation is

              allowed. If none match, including if the policy list is empty, the operation is disallowed.

              Missing optional parameters will have their defaults specified according to the matched

              policy. The default for new keys is `[{}]` (no constraints).

              If (part of) a constraint is not specified, anything is allowed for that constraint.'
          minimum_key_length:
            type:
            - integer
            - 'null'
            minimum: 0
            maximum: 4294967295
            description: 'The minimum allowed key length. This is only relevant for group or account cryptographic

              policies (and hence has no effect in an RSA policy on a specific key).'
