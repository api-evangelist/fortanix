        propertyName: $type
        mapping:
          Only: WrappingKeysVariantOnly
          Any: WrappingKeysVariantAny
    FpeDateDayMonthYear:
      allOf:
      - type: object
        description: 'Represents a date that consists of a Month subpart, a Day subpart, and a Year subpart. The

          Year part is allowed to be preserved, and the Day and Month parts are allowed to be

          preserved together. (The Day part cannot be preserved if the Month part is not, and vice

          versa.)'
        properties:
          before:
            $ref: '#/components/schemas/FpeDayMonthYearDate'
          after:
            $ref: '#/components/schemas/FpeDayMonthYearDate'
    LmsOptions:
      allOf:
      - type: object
        description: LMS specific options
        properties:
          l1_height:
            type:
            - integer
            - 'null'
            minimum: 0
            maximum: 4294967295
            description: The height of the top level tree. This field will be deprecated in v2.
          l2_height:
            type:
            - integer
            - 'null'
            minimum: 0
            maximum: 4294967295
            description: The height of the secondary tree. This field will be deprecated in v2.
          digest:
            $ref: '#/components/schemas/DigestAlgorithm'
          heights:
            type:
            - array
            - 'null'
            items:
              type: integer
            description: Heights of the trees in each level.
          node_size:
            type:
            - integer
            - 'null'
            description: Amount of bytes associated to each node (the 'm' parameter)
          winternitz_width:
            type:
            - integer
            - 'null'
            description: The width of the Winternitz coefficients. The default value is 8.
    AesOptions:
      allOf:
      - type: object
        properties:
          key_sizes:
            type:
            - array
            - 'null'
