            $ref: '#/components/schemas/SobjectDescriptor'
          hash_alg:
            $ref: '#/components/schemas/DigestAlgorithm'
          hash:
            type: string
            format: byte
            description: 'The hash of the data on which the signature is being verified. Either

              `hash` or `data` should be specified; it is an error to specify both

              or none.

              Hash should be base64 encoded.'
          data:
            type: string
            format: byte
            description: 'The data on which the signature is being verified. Either `hash` or

              `data` should be specified; it is an error to specify both or none.

              Data should be base64 encoded.'
          mode:
            $ref: '#/components/schemas/SignatureMode'
          signature:
            type: string
            format: byte
            description: The signature to verify
          context:
            type: string
            format: byte
            description: 'The context parameter to be provided to the verify algorithm.


              Currently only ML-DSA keys accept a context parameter;

              this parameter must not be specified for any other key types.'
        required:
