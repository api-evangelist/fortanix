              provided the service will provide a default set of key operations. Note that if you

              provide an empty array, all key operations will be disabled.'
          state:
            $ref: '#/components/schemas/SobjectState'
          transient:
            type:
            - boolean
            - 'null'
            description: If set to true, the derived key will be transient.
          export_policy:
            $ref: '#/components/schemas/SobjectExportPolicy'
