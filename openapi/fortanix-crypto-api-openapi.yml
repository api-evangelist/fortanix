    DecryptInitRequest:
      allOf:
      - type: object
        description: Request body to initialize multi-part decryption.
        properties:
          key:
            $ref: '#/components/schemas/SobjectDescriptor'
          alg:
            $ref: '#/components/schemas/Algorithm'
          mode:
            $ref: '#/components/schemas/CipherMode'
          iv:
            type: string
