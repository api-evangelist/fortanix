            description: 'Group ID of the group that this security object should belong to. The user or

              application creating this security object must be a member of this group. If no group is

              specified, the default group for the requesting application will be used.'
          key_type:
            $ref: '#/components/schemas/ObjectType'
          mechanism:
            $ref: '#/components/schemas/TransformKeyMechanism'
          enabled:
            type:
            - boolean
            - 'null'
            description: Whether the transformed key should have cryptographic operations enabled.
          description:
            type:
            - string
            - 'null'
            description: Description of the transformed key
          custom_metadata:
            type:
            - object
            - 'null'
            additionalProperties:
              type: string
            description: User-defined metadata for this key stored as key-value pairs.
          key_ops:
            type:
            - array
            - 'null'
            items:
              $ref: '#/components/schemas/KeyOperations'
            description: 'Optional array of key operations to be enabled for this security object. If not

              provided the service will provide a default set of key operations. Note that if you

              provide an empty array, all key operations will be disabled.'
          state:
            $ref: '#/components/schemas/SobjectState'
          transient:
            type:
            - boolean
            - 'null'
            description: If set to true, the transformed key will be transient.
          export_policy:
            $ref: '#/components/schemas/SobjectExportPolicy'
        required:
        - key_type
        - mechanism
    FpeOptionsBasic:
      allOf:
      - type: object
        description: 'Basic FPE-specific options. This is suitable for simple datatypes

          that consist of ASCII digits, or ASCII digits and uppercase letters.'
        properties:
          radix:
            type: integer
            minimum: 0
            maximum: 4294967295
            description: 'The FPE base for the input data (i.e., the size of the character

              set of the datatype). This must be an integer from 2 to 36.


              This also implicitly defines the alphabet of the datatype. A base

              from 2 to 10 implies ASCII digits (e.g., a radix of 3 can be used

              to represent a ternary string), and a base from 11 to 36 implies

              ASCII digits and uppercase letters (e.g., a radix of 16 can be'
          min_length:
            type: integer
            minimum: 0
            maximum: 4294967295
            description: The minimum allowed length for the input data.
          max_length:
            type: integer
            minimum: 0
            maximum: 4294967295
            description: The maximum allowed length for the input data.
          preserve:
            type: array
            items:
              type: integer
              format: int64
            description: 'The list of indices of characters to be preserved while performing encryption/decryption.

              Indices are Python-like; i.e., nonnegative indices index from the beginning of the input

              (where 0 is the first character), and negative indices index from the end of the input.

              (where -1 is the last character, -2 is second to last, and so on).


              Any preserved characters will be concatenated together and used as an FF1 tweak. For example,

              if the input data is "abcd", and the first and last characters are to be preserved, the FF1

              tweak will be the ASCII bytes of the string "ad".'
          mask:
            type:
            - array
            - 'null'
            items:
              type: integer
              format: int64
            description: 'The list of indices of characters to be masked while performing masked decryption.

              Indices are Python-like; i.e., nonnegative indices index from the beginning of the input

              (where 0 is the first character), and negative indices index from the end of the input.

              (where -1 is the last character, -2 is second to last, and so on).'
          luhn_check:
            type:
            - boolean
            - 'null'
            description: 'Whether the encrypted/decrypted data contains a checksum digit that satisfies the Luhn

              formula. (The output ciphertext/plaintext will also contain a Luhn checksum digit.)'
          name:
            type:
            - string
            - 'null'
            description: The user-provided name for the data type that represents the input data.
        required:
        - radix
        - min_length
        - max_length
        - preserve
    EncapsulateKeyResponse:
      allOf:
      - type: object
        description: Result of an encapsulation request.
        properties:
