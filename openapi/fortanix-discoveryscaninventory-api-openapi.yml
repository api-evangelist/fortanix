            type: array
          version:
            maximum: 4294967295
            minimum: 0
            type: integer
        required:
        - version
        - encapsulated_content_type
        - digest_algorithms
        - signer_info
        type: object
    DiscoveryDsmSobjectRotationPolicy:
      allOf:
      - properties:
          deactivate_rotated_key:
