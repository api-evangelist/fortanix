  parameters:
    NodeId:
      name: node-id
      in: path
      required: true
      description: UUID of a compute node.
      schema:
        type: string
        format: uuid
    NodeStatusType:
      name: status
      in: query
      description: Status string for the compute node.
      schema:
        type: string
        enum:
        - RUNNING
        - STOPPED
        - FAILED
        - UNKNOWN
    NodeUpdateRequest:
      name: body
      in: body
      required: true
      description: Request to update a compute node.
      schema:
        $ref: '#/components/schemas/NodeUpdateRequest'
    NodeProvisionRequest:
      name: body
      in: body
      required: true
      description: Request to provision a compute node.
      schema:
        $ref: '#/components/schemas/NodeProvisionRequest'
  securitySchemes:
    bearerToken:
      type: apiKey
      in: header
      name: Authentication
      description: A JWT bearer token to be passed once authenticated.
