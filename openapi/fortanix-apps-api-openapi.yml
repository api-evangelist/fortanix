      description: 'A GeneralName that can be used as a [subject alternative name][SAN] in

        a certificate.


        Today, the directoryName, dNSName, and iPAddress choices are supported.

        Note that directoryName can also be used to represent the subject field

        in a certificate.


        [SAN]: https://datatracker.ietf.org/doc/html/rfc5280#section-4.2.1.6'
      oneOf:
      - title: SubjectGeneralVariantDirectoryName
        type: object
        properties:
          directory_name:
            type: array
            items:
              type: array
              minItems: 2
              maxItems: 2
              items:
                type: string
            description: 'A directoryName, which consists of a sequence of (type, value)

              pairs, where type is an OID, and value is a DER-encoded ASN.1

              value. (This represents a sequence of relative distinguished

              names.)'
        required:
        - directory_name
      - title: SubjectGeneralVariantDnsName
        type: object
        properties:
          dns_name:
            type: string
            description: A DNS name.
        required:
        - dns_name
